# CRM Chat Application Configuration
server:
  port: 20108  # PHP 使用的端口

spring:
  application:
    name: crmchat

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CRMCHAT_DB_URL:jdbc:mysql://47.97.102.216:13306/crmeb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${CRMCHAT_DB_USERNAME:root}
    password: ${CRMCHAT_DB_PASSWORD:root}

  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

  # Redis配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 6000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # Mail配置
  mail:
    host: smtp.hostinger.com
    port: 465
    username: team@talkomamail.com
    password: zE}gh#1v#^taf
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
            fallback: false
          starttls:
            enable: false
            required: false
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000


# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: io.renren.crmchat.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Swagger配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  info:
    title: CRM Chat API
    description: Customer Service System API (PHP Compatible)
    version: 1.0.0

# CRM Chat JWT配置
crmchat:
  jwt:
    # JWT密钥 (生产环境请通过环境变量 CRMCHAT_JWT_SECRET 注入)
    secret: ${CRMCHAT_JWT_SECRET:change-me-in-production}
    # Token过期时间(秒)
    # 原始值: 7200秒（2小时）
    # 修改为: 86400秒（24小时） - 客服长期在线需求
    expire: ${CRMCHAT_JWT_EXPIRE:86400}
  # 验证码配置
  captcha:
    # 验证码有效期（秒）
    expire-seconds: ${CRMCHAT_CAPTCHA_EXPIRE:600}
    # 发送频率限制（秒）- 同一邮箱在此时间内只能发送一次
    rate-limit-seconds: ${CRMCHAT_CAPTCHA_RATE_LIMIT:30}

# Renren Redis配置
renren:
  redis:
    open: true

# File Upload Configuration
file:
  upload:
    # 文件上传路径（使用绝对路径或相对于项目根目录）
    # Windows: E:/crmchat/uploads 或 ./uploads
    # Linux: /var/www/crmchat/uploads 或 ./uploads
    path: ${FILE_UPLOAD_PATH:./uploads}
    # 文件访问域名
    domain: ${FILE_UPLOAD_DOMAIN:http://lxd.vv-xj.com}
  storage:
    # 存储类型: local, oss, cos, qiniu
    type: ${FILE_STORAGE_TYPE:local}

kefu_path: ${KEFU_DOMAIN:http://lxd.vv-xj.com}

# Geo Location Configuration
geo:
  # 是否启用本地IP模拟数据（开发环境建议开启，生产环境建议关闭）
  mock-local-ip: true